{% extends "layout.html" %}
{% block content %}

<div class="container mt-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
    <h2 class="mb-3 mb-md-0">Media </h2>
    
    <a class="btn btn-info btn-sm" href="{{ url_for('media') }}">Back</a>
  </div>
  <span class="badge badge-secondary">{{ media.media_name }}</span>
  <hr>






  <div class="row">
    <div class="col-12 col-md-6 mb-3">
      {% if media.media_type == 'Video' %}
        <video controls autoplay class="w-100" style="max-height: 480px;">
          <source src="{{ url_for('static', filename='upload_assets/upload_media/' + media.media_name) }}" type="video/mp4">
        </video>
      {% else %}
        <img src="{{ url_for('static', filename='upload_assets/upload_media/' + media.media_name) }}" class="img-fluid" style="max-height: 480px;" />
      {% endif %}
    </div>

    {% if media.description %}
    <div class="col-12 col-md-6 d-flex flex-column justify-content-center">
      <h3>Description</h3>
      <p>{{ media.description }}</p>
    </div>
    {% endif %}
  </div>
</div>

{% endblock content %}
