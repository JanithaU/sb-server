{% extends "layout.html" %}
{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-4 col-md-6 col-sm-8 col-12 mt-5">
      <div class="content-section p-4 border rounded shadow-sm bg-light text-center">
        <h1 class="display-5 text-danger mb-3">404</h1>
        <h4 class="mb-3">Page Not Found</h4>
        <p class="text-muted mb-4">
          Oops! The page you're looking for doesn't exist or may have been moved.
        </p>
        <a href="{{ url_for('home') }}" class="btn btn-outline-info btn-block">
          Go back to the Homepage
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
