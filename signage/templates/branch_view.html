{% extends "layout.html" %}
{% block content %}

<div class="container mt-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
    <h2 class="mb-3 mb-md-0">Branch</h2>
    <a class="btn btn-info btn-sm" href="{{ url_for('branch') }}">Go Back</a>
  </div>
  <hr>

  <div class="row">
    <div class="col-12 col-md-6">
      <div class="content-section">
        <form>
          <fieldset class="form-group">
            <legend class="border-bottom mb-4">View Branch</legend>

            <div class="mb-3">
              <label class="form-label">Branch Group Name</label>
              <select class="form-select" disabled> 
                <option>{{ bGG.group.branch_group_name }}</option>
              </select>              
            </div>

            <div class="mb-3">
              <label class="form-label">Branch Name</label>
              <input type="text" class="form-control" value="{{ bGG.branch_name }}" disabled>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" value="{{ bGG.description }}" disabled>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" {% if bGG.active_status %} checked {% endif %} disabled>
              <label class="form-check-label">Active</label>
            </div>

          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
