{% extends "layout.html" %}
{% block content %}

<div class="container mt-3">
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
		<h2 class="mb-3 mb-md-0">
  Playlist</h2>
  <div class="d-flex flex-column flex-sm-row" style="gap: 4px;">
    <a href="{{ url_for('playlist_items', playlist_id=playlist.id)}}" class="btn btn-info btn-sm">+ Media</a>
    <a class="btn btn-info btn-sm" href="{{ url_for('playlist')}}" role="button">Back</a>
  </div>
</div>
</h2>





<h6><span class="badge badge-secondary">{{ playlist.playlist_name }}</span></h6>
<hr>

<div class="row">
  <!-- Media Select -->
  <div class="col-12 col-md-3 mb-3">
    <select class="form-control" size="6" id="mediaselect">
      {% for media in plmedia %}
        <option value="{{media.media.id}}">{{media.media.media_name}}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Preview Area -->
  <div class="col-12 col-md-9 mb-3 text-center">
    <video controls autoplay class="img-fluid" id="video_preview" style="display:none; max-height: 400px;">
      <source src="" type="video/mp4">
    </video>
    <img src="" id="image_preview" class="img-fluid" style="max-height: 400px;">
  </div>
</div>

<script src="{{ url_for('static', filename='js/jq.min.js') }}"></script>
<script type="text/javascript">
$("#mediaselect").change(function() {
    $.ajax({
        type: "POST",
        url: "{{ url_for('get_media_for_playlist_preview') }}",
        data: { media_id: $("#mediaselect").val() },
        success: function(data) {
            var sp = data.split('=', 2);
            var video = $("#video_preview")[0];
            if (sp[0] === 'Video') {
                $("#image_preview").hide();
                $("#video_preview").show();
                video.src = sp[1];
                video.load();
                video.play();
            } else {
                $("#video_preview").hide();
                $("#image_preview").show().attr('src', sp[1]);
            }
        }
    });
});
</script>
</div>
{% endblock content %}
