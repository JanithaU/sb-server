{% extends "layout.html" %}
{% block content %}

<div class="container mt-3">
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
		<h2 class="mb-3 mb-md-0">
  Node</h2>
 <div class="d-flex flex-column flex-sm-row" style="gap: 4px;">
    
    <a class="btn btn-info btn-sm" href="{{ url_for('node')}}">Go Back</a>
 </div>
</div>
<hr>





<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="content-section">
      <form>
        <fieldset class="form-group">
          <legend class="border-bottom mb-4">View Node</legend>

          <!-- Branch Group -->
          <div class="form-group">
            <label class="form-control-label">Branch Group Name</label>
            <select class="custom-select" disabled>
              <option>{{ bGG.branch.group.branch_group_name }}</option>
            </select>
          </div>

          <!-- Branch Name -->
          <div class="form-group">
            <label class="form-control-label">Branch Name</label>
            <input class="form-control" value="{{ bGG.branch.branch_name }}" disabled>
          </div>

          <!-- Node Name -->
          <div class="form-group">
            <label class="form-control-label">Node Name</label>
            <input class="form-control" value="{{ bGG.node_name }}" disabled>
          </div>

          <!-- Node Password -->
          <div class="form-group">
            <label class="form-control-label">Node Password</label>
            <div class="input-group">
              <input class="form-control" type="password" id="node_password" value="{{ bGG.node_password }}" disabled>
              <div class="input-group-append">
                <button class="btn btn-outline-secondary" type="button" onclick="showPassword()">
                  <span class="fa fa-eye" id="showpass"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label class="form-control-label">Description</label>
            <input class="form-control" value="{{ bGG.description }}" disabled>
          </div>

          <!-- Active Status -->
          <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="active_status" {% if bGG.active_status %} checked {% endif %} disabled>
            <label class="form-check-label" for="active_status">Active</label>
          </div>

        </fieldset>
      </form>
    </div>
  </div>
</div>


</div>
<script type="text/javascript">
function showPassword(){
  var x = document.getElementById("node_password");
  var y = document.getElementById("showpass");

  if (x.type === "password") {
    x.type = "text";
    y.className ="fa fa-eye-slash";
  } else {
    x.type = "password";
    y.className ="fa fa-eye";
  }
}
</script>

{% endblock content %}
