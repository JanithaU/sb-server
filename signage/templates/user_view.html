{% extends "layout.html" %}
{% block content %}

<div class="container mt-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
    <h2 class="mb-3 mb-md-0">User</h2>
    <a class="btn btn-info btn-sm" href="{{ url_for('user')}}">Go Back</a>
  </div>
  <hr>


  <div class="row justify-content-center">
    <div class="col-12 col-md-8">
      <div class="content-section">
        <form>
          <fieldset class="form-group">
            <legend class="border-bottom mb-4">View User</legend>

            <div class="form-group">
              <label class="form-control-label">Name</label>
              <input class="form-control form-control-lg" value="{{ user.firstname }}" disabled>
            </div>

            <div class="form-group">
              <label class="form-control-label">User Name</label>
              <input class="form-control form-control-lg" value="{{ user.username }}" disabled>
            </div>

            <div class="form-group">
              <label class="form-control-label">Email</label>
              <input class="form-control form-control-lg" value="{{ user.email }}" disabled>
            </div>

            <div class="form-group form-check">
              <input class="form-check-input" type="checkbox" id="active_status" {% if user.active_status %} checked {% endif %} disabled>
              <label class="form-check-label" for="active_status">Active</label>
            </div>

            <label class="form-control-label"><h5>Permissions</h5></label>
            <div class="d-flex flex-wrap ml-2">
              {% for x in r %}
                <span class="badge badge-secondary mr-1 mb-1">{{ x }}</span>
              {% endfor %}
            </div>

          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
