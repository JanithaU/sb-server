{% extends "layout.html" %}
{% block content %}

<div class="container mt-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
    <h2 class="mb-3 mb-md-0">Branch Group</h2>
    <a class="btn btn-info btn-sm" href="{{ url_for('branch_group_function') }}">Go Back</a>
  </div>
  <hr>

  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card shadow-sm p-3">
        <form>
          <fieldset class="form-group">
            <legend class="border-bottom mb-4">View Branch Group</legend>

            <!-- Group Name -->
            <div class="mb-3">
              <label class="form-label">Group Name</label>
              <input class="form-control" value="{{ bGG.branch_group_name }}" disabled>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input class="form-control" value="{{ bGG.description }}" disabled>
            </div>

            <!-- Active Status -->
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" {% if bGG.active_status %} checked {% endif %} disabled>
              <label class="form-check-label">Active</label>
            </div>

          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
